name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p www && cp index.html www/
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#12194a' --iconBackgroundColorDark '#12194a' --splashBackgroundColor '#12194a' --splashBackgroundColorDark '#12194a'
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Notes-Maker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
