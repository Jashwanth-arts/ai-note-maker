<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Student Note Maker</title>
<style>
:root{--navy:#12194a;--navy2:#232d7a;--pur:#7c3aed;--lil:#ede9fe;--bg:#f3f2fb;--tx:#1b1f45;--mu:#686c93;--ok:#15803d;--bad:#c62828;--gold:#f5b301}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Noto Sans","Noto Sans Oriya","Noto Sans Devanagari",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;background:linear-gradient(135deg,var(--navy),var(--pur));color:#fff}
header h1{flex:1;margin:0;font-size:19px;font-weight:700}
header button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:12px;width:38px;height:38px;font-size:18px}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #e1def5;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:11px;padding:4px 0}
nav button b{display:block;font-size:21px;font-weight:400}
nav button.on{color:var(--pur);font-weight:700}
nav .plus b{background:var(--pur);color:#fff;width:46px;height:46px;border-radius:50%;margin:-22px auto 0;line-height:46px;box-shadow:0 4px 12px #7c3aed66}
.card{background:#fff;border-radius:18px;padding:16px;margin:0 0 12px;box-shadow:0 1px 2px #12194a14}
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:20px;margin-bottom:12px}
.hero h2{margin:0 0 4px;font-size:22px}.hero p{margin:0;opacity:.8}
h3{margin:0 0 8px;font-size:17px;color:var(--navy)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid #d6d2f0;border-radius:12px;font:inherit;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pur);border-color:var(--pur)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:700 16px inherit;background:var(--pur);color:#fff;margin-top:12px}
.btn.sec{background:var(--lil);color:var(--pur)}.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:6px 6px 0 0}
.btn.red{background:#fde8e8;color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #d6d2f0;background:#fff;border-radius:20px;padding:7px 13px;font-size:14px;color:var(--tx)}
.chip.on{background:var(--pur);border-color:var(--pur);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border-radius:18px;padding:16px;border:0;text-align:left;font:inherit;color:var(--tx);box-shadow:0 1px 2px #12194a14}
.tile b{display:block;font-size:26px}.tile span{font-size:13px;color:var(--mu)}
.mode{border:2px solid #d6d2f0;border-radius:16px;padding:12px;background:#fff;text-align:left;font:inherit;color:var(--tx)}
.mode.on{border-color:var(--pur);background:var(--lil)}.mode b{display:block}.mode span{font-size:13px;color:var(--mu)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative}.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:12px}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{border:0;border-radius:20px;padding:8px 14px;background:#e4e0f8;color:var(--navy);white-space:nowrap;font:600 14px inherit}
.tabs button.on{background:var(--navy);color:#fff}
.kw{padding:8px 0;border-bottom:1px solid #eeecfa}.kw:last-child{border:0}.kw b{color:var(--pur)}
ul.pts{margin:0;padding-left:20px}ul.pts li{margin:6px 0}
.notes p{margin:6px 0}.notes h4{margin:14px 0 4px;color:var(--navy);font-size:17px}.notes li{margin:4px 0}
.dgm{text-align:center}.dgm .ctr{display:inline-block;background:var(--navy);color:#fff;border-radius:20px;padding:10px 18px;font-weight:700;margin-bottom:10px}
.dgm .br{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;text-align:left}
.dgm .br div{border:2px solid var(--pur);border-radius:14px;padding:8px 10px;font-size:14px}.dgm .br b{color:var(--pur);display:block}
.flow{display:flex;flex-direction:column;align-items:center}
.flow div{background:var(--lil);border:2px solid var(--pur);border-radius:14px;padding:9px 14px;text-align:center;width:90%}
.flow i{font-style:normal;color:var(--pur);font-size:20px;line-height:1.1}
.opt{display:block;width:100%;text-align:left;border:2px solid #d6d2f0;background:#fff;border-radius:14px;padding:12px;margin:8px 0;font:inherit;color:var(--tx)}
.opt.good{border-color:var(--ok);background:#e6f6ea}.opt.wrong{border-color:var(--bad);background:#fdeaea}
.bar{height:10px;background:#e4e0f8;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pur)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mu);font-size:13px}
.flash{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:700;background:var(--navy);color:#fff;border-radius:22px;padding:20px;border:0;width:100%}
.flash.back{background:var(--pur);font-size:17px;font-weight:500}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;margin:8px 0;white-space:pre-wrap}
.msg.u{background:var(--pur);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.a{background:#fff;border-bottom-left-radius:4px}
.warn{background:#fff6dc;border:1px solid var(--gold)}
.av{border-radius:50%;background:var(--pur);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex:none;border:3px solid #ffffff66}.av img{width:100%;height:100%;object-fit:cover}
#busy{position:fixed;inset:0;background:#12194acc;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20;text-align:center;padding:20px}
#busy.on{display:flex}.spin{width:44px;height:44px;border:5px solid #ffffff44;border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite;margin-bottom:12px}@keyframes s{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:20px;z-index:30;display:none;max-width:88%;text-align:center}
.flow{gap:4px}.flow div.dec{border-color:var(--gold);background:#fff6dc}.flow small{color:var(--mu);font-weight:600}.dg{border-top:1px solid #eeecfa;padding-top:10px;margin-top:10px}
</style></head><body>
<div id="app"></div><div id="busy"><div class="spin"></div><div id="bmsg"></div></div><div id="toast"></div>
<input type="file" id="gal" accept="image/*" multiple hidden onchange="addFiles(this.files)">
<input type="file" id="pic" accept="image/*" hidden onchange="picFile(this.files[0])">
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
let S={profile:ld('profile',null),notes:ld('notes',[]),hist:ld('hist',[]),quiz:ld('quiz',[]),chat:ld('chat',[]),key:ld('key',''),model:ld('model','claude-haiku-5-5')};
const persist=()=>{for(const k in S)localStorage.setItem(k,JSON.stringify(S[k]))};
const SUBJ=c=>{const b=['English','Hindi','Odia','Maths'];
 if(c<=5)return[...b,'EVS','Computer','Drawing','General Knowledge'];
 if(c<=8)return[...b,'Science','Social Science','Sanskrit','Computer'];
 if(c<=10)return[...b,'Science','Physics','Chemistry','Biology','History','Geography','Civics','Economics','Sanskrit','Computer'];
 return[...b,'Physics','Chemistry','Biology','Accountancy','Business Studies','Economics','Political Science','History','Geography','Computer Science']};
let V={v:'home'},H=[],PF=null,F={subject:'',chapter:'',mode:'clean',lang:'English'},imgs=[],TB='ov',Q=null,FC=null,RF='All',busyChat=false;
const today=()=>new Date().toISOString().slice(0,10);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2800)};
const busy=m=>{$('#bmsg').textContent=m||'';$('#busy').classList.toggle('on',!!m)};
function go(v,a,b){H.push(V);V={v,a,b};render();scrollTo(0,0)}
function tab(v){H=[];V={v};render();scrollTo(0,0)}
function back(){V=H.pop()||{v:'home'};render()}
function log(type,text){S.hist.unshift({t:Date.now(),type,text});S.hist=S.hist.slice(0,200);persist()}
function render(){
 if(!S.profile&&V.v!=='profile'){V={v:'profile'};H=[]}
 const M={profile:vProfile,home:vHome,create:vCreate,note:vNote,notes:vNotes,tutor:vTutor,revise:vRevise,progress:vProgress,settings:vSettings,quiz:vQuiz,cards:vCards};
 const T={profile:'Your profile',home:'Student Note Maker',create:'Make notes',note:'Notes',notes:'Saved notes',tutor:'AI Tutor',revise:'Exam revision',progress:'My progress',settings:'Settings',quiz:'Quiz',cards:'Flashcards'};
 const top=['home','notes','tutor','progress','revise'].includes(V.v);
 const nb=(v,i,l,c)=>`<button class="${c||''} ${V.v===v?'on':''}" onclick="tab('${v}')"><b>${i}</b>${l}</button>`;
 $('#app').innerHTML=`<header>${top||V.v==='profile'&&!S.profile?'':'<button onclick="back()">←</button>'}<h1>${T[V.v]}</h1>${S.profile?'<button onclick="go(\'settings\')">⚙</button>':''}</header><main>${M[V.v]()}</main>${S.profile?`<nav>${nb('home','🏠','Home')}${nb('notes','📚','Notes')}${nb('create','＋','Create','plus').replace("tab('create')","tab('create')")}${nb('tutor','💬','Tutor')}${nb('progress','📈','Progress')}</nav>`:''}`;
 if(V.v==='tutor'){const c=$('#chat');if(c)scrollTo(0,document.body.scrollHeight)}
}
/* PROFILE */
function vProfile(){
 if(!PF)PF=S.profile?JSON.parse(JSON.stringify(S.profile)):{name:'',school:'',cls:6,subjects:SUBJ(6)};
 const all=[...new Set([...SUBJ(PF.cls),...PF.subjects])];
 return`<div class="card"><div style="display:flex;justify-content:center">${av(PF.photo,PF.name,96)}</div><div style="text-align:center"><button class="btn sm sec" onclick="pickPhoto()">📷 ${PF.photo?'Change':'Add'} photo</button>${PF.photo?'<button class="btn sm red" onclick="PF.photo=\'\';render()">Remove</button>':''}</div><label>Your name</label><input value="${esc(PF.name)}" oninput="PF.name=this.value" placeholder="e.g. Rajvika">
 <label>School</label><input value="${esc(PF.school)}" oninput="PF.school=this.value" placeholder="School name">
 <label>Class</label><select onchange="PF.cls=+this.value;PF.subjects=SUBJ(PF.cls);render()">${[...Array(12)].map((_,i)=>`<option ${PF.cls===i+1?'selected':''} value="${i+1}">Class ${i+1}</option>`).join('')}</select>
 <label>My subjects (tap to select)</label><div class="chips">${all.map(s=>`<button class="chip ${PF.subjects.includes(s)?'on':''}" onclick="togSub(this.dataset.s)" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>
 <label>Add another subject</label><div class="row"><input id="ns" placeholder="Subject name"><button class="btn sm" style="margin:0" onclick="addSub()">Add</button></div></div>
 <button class="btn" onclick="saveProfile()">Save profile</button>`}
const togSub=s=>{PF.subjects=PF.subjects.includes(s)?PF.subjects.filter(x=>x!==s):[...PF.subjects,s];render()};
const addSub=()=>{const v=$('#ns').value.trim();if(v&&!PF.subjects.includes(v)){PF.subjects.push(v);render()}};
function saveProfile(){if(!PF.name.trim())return toast('Please type your name');if(!PF.subjects.length)return toast('Select at least one subject');
 S.profile=PF;PF=null;persist();toast('Profile saved');tab('home')}
/* HOME */
function vHome(){const p=S.profile,st=stats();
 return`<div class="hero row" style="justify-content:flex-start;gap:14px">${av(p.photo,p.name,70)}<div><h2>Hello, ${esc(p.name)}!</h2><p>Class ${p.cls} · ${esc(p.school||'Student')}</p></div></div>
 ${S.key?'':`<div class="card warn"><b>One-time setup needed</b><div class="mut">Add your Claude API key so the AI can read photos.</div><button class="btn sm" onclick="go('settings')">Add API key</button></div>`}
 <div class="grid2"><button class="tile" onclick="tab('create')"><b>📷</b>Make notes<br><span>Photo to study material</span></button>
 <button class="tile" onclick="tab('revise')"><b>🎯</b>Exam revision<br><span>Cards, quiz, key points</span></button>
 <button class="tile" onclick="tab('tutor')"><b>💬</b>AI Tutor<br><span>Ask any doubt</span></button>
 <button class="tile" onclick="tab('notes')"><b>📚</b>Saved notes<br><span>${S.notes.length} saved</span></button></div>
 <div class="card" style="margin-top:12px"><div class="row"><div><h3>Study streak</h3><span class="mut">${st.streak} day${st.streak===1?'':'s'} in a row</span></div><div style="font-size:30px">🔥</div></div></div>
 <div class="card"><h3>Recent activity</h3>${S.hist.slice(0,4).map(h=>`<div class="mut">${ico(h.type)} ${esc(h.text)}</div>`).join('')||'<span class="mut">Nothing yet. Make your first notes!</span>'}</div>`}
const ico=t=>({note:'📝',quiz:'🎯',tutor:'💬',rev:'📖'}[t]||'•');
/* CREATE */
function vCreate(){const p=S.profile;if(!F.subject||!p.subjects.includes(F.subject))F.subject=p.subjects[0];
 return`<div class="card"><label>Subject</label><div class="chips">${p.subjects.map(s=>`<button class="chip ${F.subject===s?'on':''}" data-s="${esc(s)}" onclick="F.subject=this.dataset.s;render()">${esc(s)}</button>`).join('')}</div>
 <label>Chapter name</label><input value="${esc(F.chapter)}" oninput="F.chapter=this.value" placeholder="e.g. Photosynthesis">
 <label>What do you want?</label><div class="grid2"><button class="mode ${F.mode==='clean'?'on':''}" onclick="F.mode='clean';render()"><b>✍️ Clean Handwriting</b><span>Tidy, correct notes</span></button>
 <button class="mode ${F.mode==='study'?'on':''}" onclick="F.mode='study';render()"><b>🎓 Study Guide</b><span>Summary, keywords, diagrams, MCQs</span></button></div>
 <label>Output language</label><select onchange="F.lang=this.value">${['English','Hindi','Odia'].map(l=>`<option ${F.lang===l?'selected':''}>${l}</option>`).join('')}</select></div>
 <div class="card"><h3>Photos (up to 6)</h3><div class="row" style="justify-content:flex-start"><button class="btn sm" onclick="takePhoto()">📷 Camera</button><button class="btn sm sec" onclick="$('#gal').click()">🖼 Gallery</button></div>
 <div class="thumbs">${imgs.map((u,i)=>`<div><img src="${u}"><button onclick="imgs.splice(${i},1);render()">✕</button></div>`).join('')}</div>${imgs.length?'':'<div class="mut" style="margin-top:8px">Add clear, well-lit photos of the notebook or textbook pages.</div>'}</div>
 <button class="btn" onclick="generate()">Generate ✨</button>`}
const readFile=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
const shrink=(u,m=1500,q=.8)=>new Promise(res=>{const i=new Image();i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.onerror=()=>res(null);i.src=u});
async function addFiles(l){for(const f of l){if(imgs.length>=6){toast('Maximum 6 photos');break}const u=await shrink(await readFile(f));if(u)imgs.push(u)}$('#gal').value='';render()}
async function takePhoto(){const C=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Camera;
 if(!C)return $('#gal').click();
 try{const p=await C.getPhoto({quality:80,resultType:'base64',source:'CAMERA'});const u=await shrink('data:image/'+(p.format||'jpeg')+';base64,'+p.base64String);if(u&&imgs.length<6)imgs.push(u);render()}catch(e){}}
/* AI */
async function claude(system,messages,max){
 if(!S.key)throw new Error('Please add your API key in Settings (⚙).');
 const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:S.model,max_tokens:max||4000,system,messages})});
 const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||('Error '+r.status));
 return j.content.filter(b=>b.type==='text').map(b=>b.text).join('')}
async function generate(){
 if(!F.chapter.trim())return toast('Type the chapter name first');
 if(!imgs.length)return toast('Add at least one photo');
 const p=S.profile,study=F.mode==='study';
 const shape=study?`{"title":"","summary":"","keywords":[{"term":"","meaning":""}],"points":[""],"diagram":{"center":"","branches":[{"label":"","items":[""]}]},"flowchart":[{"t":"step text","k":"start|step|decision|end","branches":[{"label":"Yes","to":1}]}],"flowchart_from_photo":false,"diagrams":[{"name":"","what_it_shows":"","parts":[{"label":"","meaning":""}],"questions":[{"q":"","a":""}],"photo_page":1}],"mcqs":[{"q":"","options":["","","",""],"answer":0,"why":""}],"questions":[{"q":"","a":""}]}`
 :`{"title":"","clean_notes":"lines: '## ' heading, '- ' bullet, plain text","summary":"","flowchart":[{"t":"step text","k":"start|step|decision|end","branches":[{"label":"Yes","to":1}]}],"flowchart_from_photo":false,"diagrams":[{"name":"","what_it_shows":"","parts":[{"label":"","meaning":""}],"questions":[{"q":"","a":""}],"photo_page":1}]}`;
 const flowRule=`FLOWCHART: if the pages contain a flowchart (boxes and arrows, steps in sequence, or decision diamonds), COPY it faithfully: list every box in the same order as drawn, keep the student's own wording (only fix spelling), set "k" to "decision" for decision diamonds with "branches" giving each label (for example Yes or No) and "to" = the step number (1 = first box in your list) it leads to, use "start" and "end" when shown, and set "flowchart_from_photo" to true. `+(study?`If there is no flowchart on the pages, create a clear 4-8 step flowchart of a process or sequence from the chapter and set "flowchart_from_photo" to false.`:`If there is no flowchart on the pages, use [] and set "flowchart_from_photo" to false.`);
 const diagRule=`DIAGRAMS: for every real picture or diagram on the pages (maximum 4; skip decorations) give its "name", "what_it_shows" (1-2 simple sentences), "parts" (every label or part you can read, with a simple meaning), 2 "questions" with short answers, and "photo_page" (the page number it is on). If a label is unreadable write "label not clear" rather than guessing. If there are no diagrams use [].`;
 const rules=(study?`Create: summary (5-7 sentences), 8-12 keywords with simple meanings, 8-12 important points, a concept diagram (center + 3-5 branches with 2-4 items), EXACTLY 10 MCQs (4 options, "answer" is the 0-based index, short "why"), and 6 extra revision questions with short answers. `:`Rewrite the handwriting as clean, correct, well-organised notes with headings and bullet points, fixing spelling. Keep the student's content; do not add new topics. Add a short summary. `)+flowRule+' '+diagRule+' Silently ignore anything that is crossed out, and never write remarks about the page itself (such as crossed-out text or an incomplete page) inside the notes.';
 const sys=`You are a kind expert teacher for a Class ${p.cls} student. Read the photos (handwriting or textbook pages) for subject "${F.subject}", chapter "${F.chapter}". ${rules} Write all text in ${F.lang}, in simple words suited to Class ${p.cls}. Reply with ONLY valid JSON, no markdown fences, in this exact shape: ${shape}`;
 const content=[];imgs.forEach((u,i)=>{content.push({type:'text',text:'Page '+(i+1)+':'});content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:u.split(',')[1]}})});
 content.push({type:'text',text:'Make the JSON now.'});
 busy(study?'Building your study guide… about 30-60 seconds':'Cleaning your notes…');
 try{const t=await claude(sys,[{role:'user',content}],study?8000:5000);
  const d=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
  const n={id:Date.now(),hasPh:true,cls:p.cls,subject:F.subject,chapter:F.chapter.trim(),mode:F.mode,lang:F.lang,date:today(),d};
  await pPut(n.id,await Promise.all(imgs.map(u=>shrink(u,1100,.65))));S.notes.unshift(n);log('note',`Made ${study?'study guide':'clean notes'}: ${n.subject} – ${n.chapter}`);
  imgs=[];F.chapter='';busy();TB=study?'ov':'cn';H=[{v:'home'}];V={v:'note',a:n.id};render()}
 catch(e){busy();toast(e.message&&e.message.includes('JSON')?'Could not read the AI reply. Try clearer photos.':e.message)}}
/* NOTE VIEW */
const fmt=t=>String(t||'').split('\n').map(l=>l.startsWith('## ')?`<h4>${esc(l.slice(3))}</h4>`:l.startsWith('- ')?`<li>${esc(l.slice(2))}</li>`:l.trim()?`<p>${esc(l)}</p>`:'').join('');
const getN=id=>S.notes.find(n=>n.id===id);
function vNote(){const n=getN(V.a);if(!n)return'<div class="card">Note not found.</div>';const d=n.d;
 const hasV=fcSteps(d).length||(d.diagrams||[]).length,tabs=n.mode==='study'?[['ov','Summary'],['vis','Diagrams'],['qz','MCQs'],['qa','Revision Q&A']]:[['cn','Clean notes'],['sm','Summary'],...(hasV?[['vis','Diagrams & flow']]:[])];
 if(!tabs.find(t=>t[0]===TB))TB=tabs[0][0];

async function ask(){const i=$('#q'),t=i.value.trim();if(!t||busyChat)return;const n=V.a?getN(V.a):null,p=S.profile;
 S.chat.push({role:'user',content:t});busyChat=true;render();
 const sys=`You are Mitra, a friendly, patient AI tutor for ${p.name}, a Class ${p.cls} student. Explain simply with small examples and encourage them. Keep answers short. Reply in the language the student writes in (English, Hindi or Odia). If unsure, say so honestly.`+(n?` The student is studying "${n.chapter}" (${n.subject}). Notes: ${(n.d.summary||'')} ${(n.d.points||[]).join('; ')}`:'');
 try{const r=await claude(sys,S.chat.slice(-12).map(m=>({role:m.role,content:m.content})),1200);S.chat.push({role:'assistant',content:r});log('tutor','Asked tutor: '+t.slice(0,40))}
 catch(e){S.chat.pop();toast(e.message)}busyChat=false;S.chat=S.chat.slice(-30);persist();render()}
/* PROGRESS */
function stats(){const days=new Set(S.hist.map(h=>new Date(h.t).toISOString().slice(0,10)));let s=0,d=new Date();
 if(!days.has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);
 while(days.has(d.toISOString().slice(0,10))){s++;d.setDate(d.getDate()-1)}return{streak:s}}
function vProgress(){const st=stats(),by={};S.quiz.forEach(q=>{(by[q.subject]=by[q.subject]||{s:0,t:0});by[q.subject].s+=q.score;by[q.subject].t+=q.total});
 const avg=S.quiz.length?Math.round(S.quiz.reduce((a,q)=>a+q.score/q.total,0)/S.quiz.length*100):0;
 return`<div class="grid2"><div class="tile"><b>${S.notes.length}</b><span>Notes made</span></div><div class="tile"><b>${S.quiz.length}</b><span>Quizzes taken</span></div><div class="tile"><b>${avg}%</b><span>Average score</span></div><div class="tile"><b>🔥 ${st.streak}</b><span>Day streak</span></div></div>
 <div class="card" style="margin-top:12px"><h3>Score by subject</h3>${Object.keys(by).map(s=>{const p=Math.round(by[s].s/by[s].t*100);return`<div class="row"><span>${esc(s)}</span><span class="mut">${p}%</span></div><div class="bar" style="margin:3px 0 10px"><i style="width:${p}%"></i></div>`}).join('')||'<span class="mut">Take a quiz to see your progress here.</span>'}</div>
 <div class="card"><h3>Study history</h3>${S.hist.slice(0,25).map(h=>`<div class="kw"><span>${ico(h.type)} ${esc(h.text)}</span><div class="mut">${new Date(h.t).toLocaleString()}</div></div>`).join('')||'<span class="mut">No activity yet.</span>'}</div>`}
/* SETTINGS */
function vSettings(){return`<div class="card"><h3>Claude API key</h3><p class="mut">Needed for reading photos, notes and the tutor. Get it at console.anthropic.com (an adult must create the account). The key is stored only on this phone.</p><input id="k" type="password" value="${esc(S.key)}" placeholder="sk-ant-…"><label>AI model</label><select id="m"><option value="claude-haiku-5-5" ${S.model==='claude-haiku-5-5'?'selected':''}>Haiku 5.5 (fast, low cost)</option><option value="claude-sonnet-5-5" ${S.model==='claude-sonnet-5-5'?'selected':''}>Sonnet 5.5 (better handwriting)</option></select><button class="btn" onclick="S.key=$('#k').value.trim();S.model=$('#m').value;persist();toast('Saved');tab('home')">Save</button></div>
 <div class="card"><button class="btn sec" onclick="PF=null;go('profile')">Edit profile</button><button class="btn red" onclick="if(confirm('Delete ALL notes, history and profile?')){localStorage.clear();indexedDB.deleteDatabase('ainotes');location.reload()}">Reset app</button></div>`}
let lastBack=0;
(function(){const A=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;if(!A)return;
 A.addListener('backButton',()=>{if($('#busy').classList.contains('on'))return;
  if(H.length)return back();
  if(V.v!=='home'&&S.profile)return tab('home');
  if(Date.now()-lastBack<2000)return A.exitApp();
  lastBack=Date.now();toast('Press back again to exit')})})();
render();
</script></body></html>
